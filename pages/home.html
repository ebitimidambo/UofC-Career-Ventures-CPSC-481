<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Home | UC Careers</title>


  <!-- Montserrat -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >


  <!-- Shared Navigation -->

  <link
    rel="stylesheet"
    href="../assets/css/navbar.css"
  >


  <!-- Shared Top Bar -->

  <link
    rel="stylesheet"
    href="../assets/css/topbar.css"
  >


  <!-- Home Page -->

  <link
    rel="stylesheet"
    href="../assets/css/home.css?v=3"
  >

</head>


<body>


  <!-- Shared Sidebar -->

  <div id="sidebar-container"></div>


  <!-- Shared Top Bar -->

  <div id="topbar-container"></div>


  <!-- ======================================================
       Home Page
       ====================================================== -->

  <main class="home-main">


    <!-- Page Heading -->

    <h1 class="page-title">
      Home
    </h1>


    <!-- Welcome Message -->

    <p class="welcome-message">

      Welcome back to the Student Career Search Portal,
      <span id="welcome-name">Erin</span>!

    </p>


    <!-- ====================================================
         Quick Links
         ==================================================== -->

    <section class="quick-links">


      <!-- Upcoming Deadlines -->

      <div class="quick-link-card">

        <img
          class="quick-link-icon"
          src="../assets/svg/clockIcon.svg"
          alt=""
        >


        <div class="quick-link-content">

          <h2>
            Upcoming Deadlines
          </h2>

          <a
            href="calendar.html"
            class="go-button"
          >
            Go there
          </a>

        </div>

      </div>


      <!-- Pending Applications -->

      <div class="quick-link-card">

        <img
          class="quick-link-icon"
          src="../assets/svg/clipboardIcon.svg"
          alt=""
        >


        <div class="quick-link-content">

          <h2>
            Pending Applications
          </h2>

          <a
            href="applications.html"
            class="go-button"
          >
            Go there
          </a>

        </div>

      </div>


    </section>


    <!-- ====================================================
         Suggested Jobs
         ==================================================== -->

    <section class="suggested-jobs">


      <h2>
        Suggested Jobs
      </h2>


      <p class="suggested-description">

        These suggestions are based on the information in your
        profile and your career interests. Click the blue bookmark
        icon to save a job you are interested in.

      </p>


      <!-- Job cards are created by home.js -->

      <div
        id="job-list"
        class="job-list"
      >
      </div>


    </section>


  </main>


  <!-- Shared JavaScript -->

  <script
    type="module"
    src="../assets/js/common.js"
  ></script>


  <!-- Home JavaScript -->

  <script
    type="module"
    src="../assets/js/home.js?v=3"
  ></script>

  <script
    type="module"
    src="../assets/js/job-details-link.js?v=1"
  ></script>


</body>

</html>
