<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Applications | UC Careers</title>


  <!-- Fonts -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- Shared Navigation -->

  <link
    rel="stylesheet"
    href="../assets/css/navbar.css"
  >


  <!-- Shared Top Bar -->

  <link
    rel="stylesheet"
    href="../assets/css/topbar.css"
  >


  <!-- Applications -->

  <link
    rel="stylesheet"
    href="../assets/css/applications.css?v=4"
  >

</head>


<body>


  <!-- Shared Sidebar -->

  <div id="sidebar-container"></div>


  <!-- Shared Top Bar -->

  <div id="topbar-container"></div>


  <!-- ======================================================
       Applications
       ====================================================== -->

  <main class="applications-main">


    <h1 class="page-title">
      Applications
    </h1>


    <!-- ====================================================
         Page Controls
         ==================================================== -->

    <div class="applications-toolbar">


      <p class="page-description">
        View all your past job applications
      </p>


      <div class="sort-control">

        <label for="application-sort">
          Sort by:
        </label>


        <select id="application-sort">

          <option value="newest">
            Date Applied: Newest
          </option>

          <option value="oldest">
            Date Applied: Oldest
          </option>

        </select>

      </div>


    </div>


    <!-- ====================================================
         Application List
         ==================================================== -->

    <section
      id="applications-list"
      class="applications-list"
      aria-live="polite"
    >
    </section>


  </main>


  <!-- ======================================================
       View Application Modal
       ====================================================== -->

  <div
    id="view-application-modal"
    class="modal-backdrop"
    hidden
  >

    <section
      class="application-view-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="view-modal-title"
    >


      <div class="modal-header">

        <h2 id="view-modal-title">
          Application Details
        </h2>


        <button
          id="close-view-application"
          class="modal-close-button"
          type="button"
          aria-label="Close application details"
          disabled
        >
          
        </button>

      </div>


      <div
        id="view-application-content"
        class="application-view-content"
      >
      </div>


      <div class="view-modal-footer">

        <button
          id="close-view-application-footer"
          class="modal-primary-button"
          type="button"
        >
          Close
        </button>

      </div>


    </section>

  </div>


  <!-- ======================================================
       Withdraw Application Modal
       ====================================================== -->

  <div
    id="withdraw-application-modal"
    class="modal-backdrop"
    hidden
  >

    <section
      class="withdraw-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="withdraw-modal-title"
      aria-describedby="withdraw-modal-description"
    >


      <div class="modal-header">

        <h2 id="withdraw-modal-title">
          Withdraw Application
        </h2>

      </div>


      <div class="withdraw-modal-body">


        <p
          id="withdraw-modal-description"
          class="withdraw-modal-question"
        >
        </p>


        <p class="withdraw-modal-warning">
          The application will remain in your Applications list with a Withdrawn status.
        </p>


        <div class="withdraw-modal-actions">


          <button
            id="cancel-withdraw"
            class="modal-secondary-button"
            type="button"
          >
            Cancel
          </button>


          <button
            id="confirm-withdraw"
            class="modal-danger-button"
            type="button"
          >
            Withdraw
          </button>


        </div>


      </div>


    </section>

  </div>


  <!-- Shared JavaScript -->

  <script
    type="module"
    src="../assets/js/common.js"
  ></script>


  <!-- Applications JavaScript -->

  <script
    type="module"
    src="../assets/js/applications.js?v=4"
  ></script>


</body>

</html>
