<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>My Career Profile | UC Careers</title>


  <!-- Fonts -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- Shared Navigation -->

  <link
    rel="stylesheet"
    href="../assets/css/navbar.css"
  >


  <!-- Shared Top Bar -->

  <link
    rel="stylesheet"
    href="../assets/css/topbar.css"
  >


  <!-- Profile -->

  <link
    rel="stylesheet"
    href="../assets/css/profile.css?v=3"
  >

</head>


<body>


  <!-- Shared Sidebar -->

  <div id="sidebar-container"></div>


  <!-- Shared Top Bar -->

  <div id="topbar-container"></div>


  <!-- ======================================================
       My Career Profile
       ====================================================== -->

  <main class="profile-main">


    <!-- ====================================================
         Success Message
         ==================================================== -->

    <div
      id="profile-success-message"
      class="profile-success-message"
      hidden
      role="status"
    >
      Your profile has been successfully updated.
    </div>


    <!-- ====================================================
         Page Header
         ==================================================== -->

    <div class="profile-page-header">


      <div>

        <h1 class="page-title">
          My Career Profile
        </h1>

        <p class="page-description">
          View and manage the information used across your career profile.
        </p>

      </div>


      <button
        id="edit-profile-button"
        class="edit-profile-button"
        type="button"
      >
        Edit Profile
      </button>


    </div>


    <!-- ====================================================
         Identity
         ==================================================== -->

    <section class="profile-identity">


      <div
        id="profile-avatar-initials"
        class="profile-avatar"
        aria-hidden="true"
      >
      </div>


      <div class="profile-identity-text">


        <div class="profile-name-row">

          <h2 id="profile-name">
          </h2>


          <button
            id="edit-name-button"
            class="edit-name-button"
            type="button"
            aria-label="Edit name"
          >

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M4 17.3V20h2.7L17.2 9.5l-2.7-2.7L4 17.3zm15.3-9.9a.75.75 0 0 0 0-1.1l-1.6-1.6a.75.75 0 0 0-1.1 0l-1.3 1.3L18 8.7l1.3-1.3z"
                fill="currentColor"
              ></path>
            </svg>

          </button>

        </div>


        <p
          id="profile-subtitle"
          class="profile-subtitle"
        >
        </p>


      </div>


    </section>


    <!-- ====================================================
         Profile Sections
         ==================================================== -->

    <div class="profile-section-grid">


      <!-- Education -->

      <section class="profile-section-card">


        <div class="profile-section-heading">

          <div class="section-icon">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M2 8.5 12 4l10 4.5L12 13 2 8.5zm4 2.7V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.8L12 14l-6-2.8z"
                fill="currentColor"
              ></path>
            </svg>

          </div>

          <h2>
            Education
          </h2>

        </div>


        <div
          id="education-summary"
          class="profile-section-content"
        >
        </div>


      </section>


      <!-- Work Experience -->

      <section class="profile-section-card">


        <div class="profile-section-heading">

          <div class="section-icon">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M9 5V3h6v2h4a2 2 0 0 1 2 2v4H3V7a2 2 0 0 1 2-2h4zm2 0h2V4h-2v1zM3 13h7v1h4v-1h7v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6z"
                fill="currentColor"
              ></path>
            </svg>

          </div>

          <h2>
            Work Experience
          </h2>

        </div>


        <div
          id="work-summary"
          class="profile-section-content"
        >
        </div>


      </section>


      <!-- Career Interests -->

      <section class="profile-section-card">


        <div class="profile-section-heading">

          <div class="section-icon">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M12 2a7 7 0 0 0-4 12.7V18h8v-3.3A7 7 0 0 0 12 2zm-3 18h6v2H9v-2z"
                fill="currentColor"
              ></path>
            </svg>

          </div>

          <h2>
            Career Interests
          </h2>

        </div>


        <div
          id="interests-summary"
          class="profile-section-content"
        >
        </div>


      </section>


      <!-- Skills -->

      <section class="profile-section-card">


        <div class="profile-section-heading">

          <div class="section-icon">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="m13.8 3 .5 2.2c.5.2 1 .5 1.4.8l2.1-.7 1.5 2.6-1.6 1.5c.1.5.1 1.1 0 1.6l1.6 1.5-1.5 2.6-2.1-.7c-.4.3-.9.6-1.4.8l-.5 2.2h-3l-.5-2.2c-.5-.2-1-.5-1.4-.8l-2.1.7-1.5-2.6L6.9 11c-.1-.5-.1-1.1 0-1.6L5.3 7.9l1.5-2.6 2.1.7c.4-.3.9-.6 1.4-.8l.5-2.2h3zM12 8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"
                fill="currentColor"
              ></path>
            </svg>

          </div>

          <h2>
            Skills
          </h2>

        </div>


        <div
          id="skills-summary"
          class="profile-section-content"
        >
        </div>


      </section>


      <!-- Documents -->

      <section class="profile-section-card profile-section-card-wide">


        <div class="profile-section-heading">

          <div class="section-icon">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M6 2h8l4 4v16H6V2zm8 1.8V7h3.2L14 3.8zM8 11h8v1.5H8V11zm0 4h8v1.5H8V15z"
                fill="currentColor"
              ></path>
            </svg>

          </div>

          <h2>
            Documents
          </h2>

        </div>


        <div
          id="documents-summary"
          class="profile-section-content"
        >
        </div>


      </section>


    </div>


  </main>


  <!-- ======================================================
       Edit Name Modal
       ====================================================== -->

  <div
    id="edit-name-modal"
    class="modal-backdrop"
    hidden
  >


    <section
      class="profile-modal name-edit-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="edit-name-modal-title"
    >


      <div class="profile-modal-header">

        <h2 id="edit-name-modal-title">
          Edit Name
        </h2>

      </div>


      <div class="profile-modal-body">


        <label
          class="profile-field-label"
          for="first-name-input"
        >
          First name:
        </label>

        <input
          id="first-name-input"
          class="profile-text-input"
          type="text"
          autocomplete="given-name"
        >


        <label
          class="profile-field-label"
          for="last-name-input"
        >
          Last name:
        </label>

        <input
          id="last-name-input"
          class="profile-text-input"
          type="text"
          autocomplete="family-name"
        >


        <p
          id="name-attempt-message"
          class="name-attempt-message"
        >
        </p>


        <div class="profile-modal-actions">


          <button
            id="cancel-name-edit-button"
            class="secondary-button"
            type="button"
          >
            Cancel
          </button>


          <button
            id="save-name-edit-button"
            class="primary-button"
            type="button"
          >
            Save
          </button>


        </div>


      </div>


    </section>


  </div>


  <!-- ======================================================
       Confirm Name Change Modal
       ====================================================== -->

  <div
    id="confirm-name-modal"
    class="modal-backdrop"
    hidden
  >


    <section
      class="profile-modal confirmation-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-name-title"
    >


      <div class="profile-modal-header">

        <h2 id="confirm-name-title">
          Confirm Name Change
        </h2>

      </div>


      <div class="profile-modal-body confirmation-modal-body">


        <p class="confirmation-question">
          Are you sure you want to update your name?
        </p>


        <p
          id="confirm-name-attempt-message"
          class="confirmation-warning"
        >
        </p>


        <div class="profile-modal-actions">


          <button
            id="back-to-name-edit-button"
            class="secondary-button"
            type="button"
          >
            Go Back
          </button>


          <button
            id="confirm-name-change-button"
            class="primary-button"
            type="button"
          >
            Confirm
          </button>


        </div>


      </div>


    </section>


  </div>


  <!-- Shared JavaScript -->

  <script
    type="module"
    src="../assets/js/common.js"
  ></script>


  <!-- Profile JavaScript -->

  <script
    type="module"
    src="../assets/js/profile.js?v=5"
  ></script>


</body>

</html>
