<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UC Careers | Student Career Search Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="login-page">

  <div class="top-stripe"></div>

  <header class="site-header">
    <img class="site-header__logo" src="assets/images/ucalgary-logo.png" alt="University of Calgary">
  </header>

  <main class="login-hero">
    <div class="login-brand">
      <h1 class="login-brand__title">
        <span class="login-brand__uc">UC</span><span class="login-brand__careers">Careers</span>
      </h1>
      <p class="login-brand__subtitle">Student Career Search Portal</p>
    </div>

    <form id="login-form" class="login-form" novalidate>
      <div class="field">
        <label class="field__label" for="username">
          Username
          <span class="help-icon" tabindex="0" role="img" aria-label="Help"
                data-tooltip="Enter your myUCalgary student portal username"></span>
        </label>
        <input class="field__input" type="text" id="username" name="username"
               placeholder="Type here..." autocomplete="username" autofocus>
      </div>

      <div class="field">
        <label class="field__label" for="password">
          Password
          <span class="help-icon" tabindex="0" role="img" aria-label="Help"
                data-tooltip="Enter your myUCalgary student portal password"></span>
        </label>
        <div class="field__control">
          <input class="field__input field__input--has-toggle" type="password" id="password" name="password"
                 placeholder="Type here..." autocomplete="current-password">
          <button type="button" id="toggle-password" class="password-toggle"
                  aria-label="Show password" aria-pressed="false"></button>
        </div>
      </div>

      <p id="login-message" class="login-message" role="alert" aria-live="polite"></p>

      <button type="submit" class="login-button">Login</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 UofC Career Ventures</p>
  </footer>

  <script type="module" src="assets/js/login.js"></script>
</body>
</html>
