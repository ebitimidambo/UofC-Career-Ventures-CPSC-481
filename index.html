<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Student Career Search Portal</title>
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-hero" aria-label="Student Career Search Portal"></section>
    <section class="login-panel">
      <div class="login-card">
        <h1>Login</h1>
        <form id="login-form" novalidate>
          <label class="field-label" for="username">Username
            <span class="help-icon" tabindex="0" aria-label="Username help">?
              <span class="tooltip">Enter your official myUCalgary username.</span>
            </span>
          </label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="Type here" required>

          <label class="field-label" for="password">Password
            <span class="help-icon" tabindex="0" aria-label="Password help">?
              <span class="tooltip">Enter your myUCalgary account password.</span>
            </span>
          </label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Type here" required>
            <button id="toggle-password" class="eye-button" type="button" aria-label="Show password">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.8"/></svg>
            </button>
          </div>

          <p id="login-error" class="form-error" role="alert" hidden></p>
          <button class="login-button" type="submit">Login</button>
        </form>
      </div>
    </section>
  </main>
  <script type="module" src="./assets/js/login.js"></script>
</body>
</html>
